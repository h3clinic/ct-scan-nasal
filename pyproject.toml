[project]
name = "ct-scan-nasal"
version = "0.1.0"
description = "Research prototype: parametric nasal airway cases, airflow resistance, and a small-model agent loop. Research only, not medical advice."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "trimesh>=4.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
sim = ["gmsh>=4.11"]
surrogate = ["torch>=2.2"]
agents = ["openai>=1.40"]
patients = ["pynrrd>=1.0"]
demo = ["gradio>=4", "plotly>=5", "scikit-image>=0.21", "pynrrd>=1.0", "openai>=1.40"]

[project.scripts]
nasal-generate = "nasal.cli:main"
nasal-simulate = "nasal.cli:simulate_main"
nasal-surrogate = "nasal.cli:surrogate_main"
nasal-agents = "nasal.cli:agents_main"
nasal-patients = "nasal.cli:patients_main"
nasal-demo = "nasal.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
